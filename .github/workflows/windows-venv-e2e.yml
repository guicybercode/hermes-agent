name: Windows profile distribution staging

# Isolated validation branch for PR #109581. This workflow is not part of the PR.

on:
  push:
    branches:
      - "wine2e/profile-distribution-staging"

permissions:
  contents: read

concurrency:
  group: windows-profile-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-distribution-staging:
    name: Native Windows profile distribution tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Verify native Windows test environment
        shell: bash
        run: |
          set -euo pipefail
          test -f .venv/Scripts/activate
          test -x .venv/Scripts/python.exe
          .venv/Scripts/python.exe -c 'import sys, pytest, win32file; assert sys.platform == "win32"; print(sys.version); print(sys.executable)'

      - name: Create temporary local SMB share for UNC coverage
        id: unc-share
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shareName = "hermes_dist_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"
          $sharePath = Join-Path $env:RUNNER_TEMP $shareName
          New-Item -ItemType Directory -Path $sharePath | Out-Null
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          "HERMES_TEST_UNC_SHARE=$shareName" >> $env:GITHUB_ENV
          New-SmbShare -Name $shareName -Path $sharePath -FullAccess $account -Temporary | Out-Null
          $uncPath = "\\localhost\$shareName"
          if (-not (Test-Path -LiteralPath $uncPath)) { throw 'Temporary UNC share is not reachable' }
          "HERMES_TEST_UNC_ROOT=$uncPath" >> $env:GITHUB_ENV

      - name: Record native path representations
        shell: bash
        run: |
          set -euo pipefail
          .venv/Scripts/python.exe - <<'PY'
          import json
          import os
          from pathlib import Path
          import win32api
          import win32file

          unc = os.environ['HERMES_TEST_UNC_ROOT']
          for path in (os.environ['TEMP'], str(Path(unc).anchor), unc):
              handle = win32file.CreateFile(
                  path, win32file.GENERIC_READ, win32file.FILE_SHARE_READ, None,
                  win32file.OPEN_EXISTING,
                  win32file.FILE_FLAG_OPEN_REPARSE_POINT | win32file.FILE_FLAG_BACKUP_SEMANTICS, None,
              )
              try:
                  info = os.lstat(path)
                  native = win32file.GetFileInformationByHandle(handle)
                  print(json.dumps({
                      'input': path,
                      'long': win32api.GetLongPathNameW(path),
                      'actual': win32file.GetFinalPathNameByHandle(handle, 0),
                      'stat_identity': [info.st_dev, info.st_ino],
                      'handle_identity': [native[4], (native[8] << 32) | native[9]],
                  }))
              finally:
                  win32file.CloseHandle(handle)
          PY

      - name: Probe native directory handle modes
        shell: bash
        run: |
          set +e
          scripts/run_tests.sh tests/hermes_cli/test_destination_handle_probe.py -j 1 --file-retries 0 --tb=short
          probe_status=$?
          cat tests/hermes_cli/test_destination_handle_probe.json
          exit "$probe_status"

      - name: Run profile distribution regression suites
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_tests.sh \
            tests/hermes_cli/test_profile_main_namespace.py \
            tests/hermes_cli/test_profile_distribution.py \
            tests/hermes_cli/test_profiles.py \
            tests/hermes_cli/test_profile_install_env_encoding.py \
            -j 2 --file-retries 0 --tb=short

      - name: Run distribution tests through native UNC paths
        if: ${{ !cancelled() && steps.unc-share.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_tests.sh tests/hermes_cli/test_profile_main_namespace.py \
            -k 'windows_unc or windows_extended_unc' \
            --basetemp="${HERMES_TEST_UNC_ROOT}\\pytest-native" \
            -j 1 --file-retries 0 --tb=short

      - name: Remove temporary SMB share
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HERMES_TEST_UNC_SHARE) {
            $share = Get-SmbShare -Name $env:HERMES_TEST_UNC_SHARE -ErrorAction SilentlyContinue
            if ($share) { Remove-SmbShare -Name $share.Name -Force }
            $sharePath = Join-Path $env:RUNNER_TEMP $env:HERMES_TEST_UNC_SHARE
            if (Test-Path -LiteralPath $sharePath) { Remove-Item -LiteralPath $sharePath -Recurse -Force }
          }
